name: Remnashop - 3.x compatible image

# Builds the image that speaks both panel lines (2.7.x-2.8.x and 3.0+) from this
# fork, and publishes it to the fork owner's own GitHub Container Registry.
#
# Kept separate from the upstream workflows on purpose: those log in with a
# GHCR_TOKEN secret a fork does not have, and push to ghcr.io/snoups, which a
# fork cannot write to.

on:
  push:
    branches:
      - feat/remnawave-3x
    tags:
      - "3x-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 🧪 Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: remnashop-test:ci
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: 🔍 Ruff
        run: >
          docker run --rm -v "$PWD/src:/opt/remnashop/src:ro" -v "$PWD/tests:/opt/remnashop/tests:ro"
          remnashop-test:ci ruff check src/ tests/

      - name: 🔍 Mypy
        run: >
          docker run --rm --env-file tests/.env.test -v "$PWD/src:/opt/remnashop/src:ro"
          remnashop-test:ci mypy

      - name: 🧪 Pytest
        run: >
          docker run --rm --env-file tests/.env.test
          -v "$PWD/src:/opt/remnashop/src:ro" -v "$PWD/tests:/opt/remnashop/tests:ro"
          remnashop-test:ci pytest -q tests/

  image:
    name: 🐳 Build and Push Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: the build is labelled with the upstream
          # release it is based on.
          fetch-depth: 0

      - name: 🛠️ Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Define Tags
        id: vars
        run: |
          # ghcr rejects upper-case repository names, and GitHub user names
          # frequently have them.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/remnashop"
          SHORT_SHA=$(git rev-parse --short HEAD)

          TAGS="${IMAGE}:3x,${IMAGE}:3x-${SHORT_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi

          # The app compares its build tag against upstream releases once an
          # hour, so it has to be a real version. "<upstream release>+3x" is
          # one: it sorts just above the release this is built on, and the next
          # upstream release still registers as an update.
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [[ -n "${BASE}" ]]; then
            BUILD_TAG="${BASE}+3x"
          else
            BUILD_TAG="dev"
          fi

          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "✅ Tags: ${TAGS}"
          echo "✅ Build tag: ${BUILD_TAG}"

      - name: 🏗️ Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.tags }}
          # A single-platform manifest per arch; attestation manifests confuse
          # older docker clients on the pulling side.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
          build-args: |
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ steps.vars.outputs.short_sha }}
            BUILD_TAG=${{ steps.vars.outputs.build_tag }}
            BUILD_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
